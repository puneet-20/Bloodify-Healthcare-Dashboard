spring.application.name=bloodify-app

# --- Database: Supabase PostgreSQL (values come from environment variables) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Template/static caching: off locally, on in production (set env vars on Render) ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:0}

# --- Session cookie hardening ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# --- Behind Render's HTTPS proxy ---
server.forward-headers-strategy=framework

# --- Render provides PORT; default 8080 locally ---
server.port=${PORT:8080}
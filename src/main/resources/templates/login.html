<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Login - Bloodify</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex;
               min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
        .card { background: #fff; padding: 32px; border-radius: 12px; width: 100%; max-width: 360px;
                box-shadow: 0 4px 20px rgba(0,0,0,.08); }
        h1 { margin: 0 0 4px; color: #b71c1c; font-size: 1.5rem; }
        p.sub { margin: 0 0 20px; color: #64748b; font-size: .9rem; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
                box-sizing: border-box; font-size: 1rem; }
        button { margin-top: 20px; width: 100%; padding: 12px; background: #b71c1c; color: #fff;
                 border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: .9rem; }
        .err { background: #fee2e2; color: #991b1b; }
        .ok { background: #dcfce7; color: #166534; }
        a { color: #b71c1c; font-size: .9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Bloodify Staff</h1>
    <p class="sub">Sign in to add and manage donors.</p>

    <div class="msg err" th:if="${param.error}">Invalid username or password.</div>
    <div class="msg ok" th:if="${param.logout}">You have been signed out.</div>

    <form method="post" th:action="@{/login}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <p><a href="/">&larr; Back to dashboard</a></p>
</div>
</body>
</html>
